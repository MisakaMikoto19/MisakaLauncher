crash.advice.atlasFull.title=Débordement de l’atlas de textures (pas un manque de VRAM)
crash.advice.atlasFull.detail=Ce modpack contient plus de textures qu’un atlas ne peut en contenir. Le côté de l’atlas correspond à la taille maximale de texture annoncée par le pilote (ligne « Max Texture Size: ») : 32768 chez NVIDIA, 16384 chez AMD/Intel, soit 4x en surface. Ce n’est lié ni à la quantité de VRAM ni au fait d’avoir un GPU dédié. Retirez les plus grosses textures HD (véhicules 4K, objets 2K-4K) ou les mods qui les fournissent, puis relancez.
crash.advice.gpuMemory.title=Échec d’allocation mémoire du GPU / pilote
crash.advice.gpuMemory.detail=Le GPU n’a pas pu allouer davantage de mémoire de texture. Désactivez les shaders et les autres logiciels gourmands, baissez le préréglage graphique et la distance de rendu ; si cela persiste, activez « Préférer le GPU dédié » et vérifiez que le GPU dédié est bien utilisé.
crash.advice.javaHeap.title=Tas Java insuffisant
crash.advice.javaHeap.detail=Augmentez la mémoire maximale de l’instance (par exemple 4096M), ou chargez moins de mods à la fois.
crash.advice.modConflict.title=Conflit de mods ou dépendance manquante
crash.advice.modConflict.detail=Le rapport liste les dépendances manquantes et les mods en conflit : ajoutez les dépendances requises, ou retirez un à un les mods récemment ajoutés.
crash.advice.javaVersion.title=Version de Java incompatible avec les mods
crash.advice.javaVersion.detail=Définissez la version de Java requise (Java 11 pour 1.16.5, Java 17 pour 1.20.1), ou utilisez des builds de mods compatibles avec votre Java.
crash.advice.gpuDriver.title=Erreur du pilote graphique
crash.advice.gpuDriver.detail=Mettez à jour le pilote depuis le site de l’éditeur, puis désactivez les enregistreurs d’écran, les boosters de jeu et les overlays.
crash.advice.accessViolation.title=Plantage en code natif
crash.advice.accessViolation.detail=Généralement causé par le pilote graphique ou un overlay tiers : mettez à jour le pilote et désactivez les outils d’enregistrement ; si cela persiste, envoyez le rapport à l’auteur du modpack.
crash.advice.unknown.title=Cause non identifiée automatiquement
crash.advice.unknown.detail=Ouvrez le rapport et regardez « Description » ainsi que la première exception qui suit ; vous pouvez aussi l’envoyer à l’auteur du modpack ou du mod.

