settings.preferDiscreteGpu=Prefer the discrete GPU
settings.preferDiscreteGpu.tip=Before launching, registers the Java runtime used by the game as a Windows "High performance" graphics preference, so dual-GPU laptops render on the discrete GPU (works for NVIDIA and AMD). Identical to "Settings -> Display -> Graphics -> High performance" and can be changed back there at any time.
