settings.textureCompression=HD texture compression
settings.textureCompression.tip=Downscales HD textures that cannot fit into the texture atlas, avoiding startup crashes caused by atlas overflow. The atlas edge limit depends on the GPU: usually 32768 on NVIDIA and 16384 on AMD/Intel, a 4x difference in area, so the same modpack may start on NVIDIA but not on AMD. It is applied as an override resource pack, no mod file is modified, and you can turn it off from the in-game resource pack screen at any time.
