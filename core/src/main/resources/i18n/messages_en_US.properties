crash.title=Game crashed
crash.meta=Instance "{0}" · exit code {1}
crash.hint=The launcher identified these likely causes and fixes from the crash report and game output:
crash.reportMissing=No crash report was generated this time
crash.openReport=Open crash report
crash.openLogs=Open log folder
crash.copy=Copy diagnosis
crash.openSettings=Open related settings
crash.close=Close
crash.copied=Diagnosis copied to clipboard
crash.advice.atlasFull.title=Texture atlas overflow (not a VRAM shortage)
crash.advice.atlasFull.detail=This modpack has more textures than a single atlas can hold. The atlas edge equals the maximum texture size the driver reports (the "Max Texture Size:" line in the crash report): usually 32768 on NVIDIA and 16384 on AMD/Intel, a 4x difference in area, so the same pack may start on an NVIDIA machine but not on an AMD one. It is unrelated to how much VRAM you have or whether you use a discrete GPU. Remove or replace the largest HD textures (e.g. 4K vehicle or 2K-4K item textures), or drop the mods that ship them, then start the game again.
crash.advice.gpuMemory.title=Video / driver memory allocation failed
crash.advice.gpuMemory.detail=The GPU could not allocate more texture memory. Turn off shaders and other GPU-heavy programs and lower the graphics preset and render distance; if it still happens, enable "prefer discrete GPU" in Settings → Launch and confirm the discrete GPU is actually in use.
crash.advice.javaHeap.title=Not enough Java heap
crash.advice.javaHeap.detail=Raise the instance''s maximum memory (e.g. 4096M), or load fewer mods at once.
crash.advice.modConflict.title=Mod conflict or missing dependency
crash.advice.modConflict.detail=The crash report lists the missing dependencies and conflicting mods: add the required dependencies, or remove recently added mods one by one to find the culprit.
crash.advice.javaVersion.title=Java version does not match the mods
crash.advice.javaVersion.detail=Set the Java version this instance needs (Java 11 for 1.16.5, Java 17 for 1.20.1), or switch to mod builds compatible with your current Java.
crash.advice.gpuDriver.title=Graphics driver error
crash.advice.gpuDriver.detail=Update your graphics driver from the vendor website, then disable screen recorders, game boosters and in-game overlays and try again.
crash.advice.accessViolation.title=Native code crash
crash.advice.accessViolation.detail=Usually caused by the graphics driver or a third-party overlay: update the driver and disable screen-recording tools; if it keeps happening, send the crash report to the modpack author.
crash.advice.unknown.title=Could not identify the cause automatically
crash.advice.unknown.detail=Open the crash report and look at "Description" and the first exception after it; you can also send the crash report to the modpack or mod author.

