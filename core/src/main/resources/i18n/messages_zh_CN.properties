crash.openSettings=打开相关设置
crash.close=关闭
crash.copied=诊断信息已复制到剪贴板
crash.advice.atlasFull.title=贴图图集放不下（不是显存不足）
crash.advice.atlasFull.detail=这个整合包的贴图总量超过了单张图集的上限。图集边长等于显卡驱动报告的最大纹理尺寸（崩溃报告里「Max Texture Size:」那一行就是这个数字）：NVIDIA 通常 32768，AMD 与 Intel 通常 16384，容量整整差 4 倍，所以同一份整合包可能 N 卡能进、A 卡进不去 —— 与显存大小、是否用独显无关。请删掉或换掉体量最大的高清材质（如 4K 载具、2K/4K 物品贴图），或移除带着这些超大材质的模组后再进。
crash.advice.gpuMemory.title=显存 / 驱动内存分配失败
crash.advice.gpuMemory.detail=显卡无法再分配纹理内存。先关闭光影与其它占用显卡的程序，降一级画质与视距；仍然出现时再在「设置 → 启动」开启独显优先，确认用的确实是独立显卡。
crash.advice.javaHeap.title=游戏内存（Java 堆）不足
crash.advice.javaHeap.detail=在实例设置里调大最大内存（如 4096M），或减少同时加载的模组。
crash.advice.modConflict.title=模组冲突或缺少前置
crash.advice.modConflict.detail=崩溃报告里会列出缺失的前置与冲突的模组：按提示补齐依赖，或逐个移除最近新增的模组来定位。
crash.advice.javaVersion.title=Java 版本与模组不匹配
crash.advice.javaVersion.detail=在实例设置里指定该版本需要的 Java（1.16.5 用 Java 11，1.20.1 用 Java 17），或改用与当前 Java 兼容的模组版本。
crash.advice.gpuDriver.title=显卡驱动出错
crash.advice.gpuDriver.detail=到显卡厂商官网更新驱动，并关闭录屏、加速器与游戏内覆盖层后重试。
crash.advice.accessViolation.title=程序在底层崩溃
crash.advice.accessViolation.detail=多为显卡驱动或第三方覆盖层引起：先更新显卡驱动、关闭录屏等工具，仍复现请把崩溃报告发给整合包作者。
crash.advice.unknown.title=未能自动识别原因
crash.advice.unknown.detail=请打开崩溃报告，查看「Description」与紧随其后的第一个异常；也可把崩溃报告发给整合包作者或模组开发者。

